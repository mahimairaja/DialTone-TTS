[project]
name = "dialtone"
version = "0.1.0"
description = "DialTone: telephony-native text-to-speech built on ZipVoice"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    # The codec chain is imported from handset-bench, never reimplemented here.
    # This is the single most important dependency in the project: it is what
    # keeps training conditions and evaluation conditions from drifting apart.
    "handset-bench",
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = [
    "datasets>=3.0",
    "webdataset>=0.2",
    "polars>=1.0",
    "soundfile>=0.12",
]
vocoder = [
    "vocos>=0.1",
    "einops>=0.8",
    "tensorboard>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialtone"]
