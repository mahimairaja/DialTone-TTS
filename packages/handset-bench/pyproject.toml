[project]
name = "handset-bench"
version = "0.1.0"
description = "A reproducible benchmark for text-to-speech systems under telephone-line conditions"
requires-python = "==3.12.*"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "polars>=1.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "whisper-normalizer>=0.0.4",
]

# NOTE: handset-bench must never depend on dialtone. The dependency graph is
# deliberately acyclic: dialtone imports handset_bench, never the reverse.
# The DialTone adapter lives in dialtone.bench_adapter and is resolved at
# runtime by dotted path.

[project.optional-dependencies]
asr = [
    "nemo-toolkit[asr]>=2.0",
    "faster-whisper>=1.0",
    "openai-whisper>=20231117",
]
modal = ["modal>=1.5"]
piper = ["piper-tts>=1.2"]

[project.scripts]
handset-bench = "handset_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handset_bench"]
