[project]
name = "dialtone-workspace"
version = "0.0.0"
description = "DialTone: telephony-native TTS and the handset-bench eval harness"
requires-python = "==3.12.*"
# handset-bench provides the codec chain, the frozen text set and the scoring
# rules, and its CLI renders the scorecard. Pinned exactly, not to a range: these
# define what every number in this repo means, so they must not move without a
# deliberate bump and a rerun.
dependencies = ["handset-bench==0.1.0"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
dialtone = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "modal>=1.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# The explainer video is a separate tool with its own environment and its own
# ruff.toml. It is not part of the published repo, so it is not linted with it.
extend-exclude = ["video"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/dialtone/tests"]
markers = [
    "slow: long-running tests (training, full matrix runs)",
    "modal: requires Modal credentials and network",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
